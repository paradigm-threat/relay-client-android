plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.android'
}

// Release signing: prefer android/keystore.properties (gitignored), else -P / env for CI.
// Local keystore lives outside the repo: ~/.android/flashback-release.keystore
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def releaseStorePath = project.findProperty("KEYSTORE_PATH")
        ?: System.getenv("KEYSTORE_PATH")
        ?: keystoreProperties.getProperty("storeFile")
def releaseStorePassword = project.findProperty("ANDROID_KEYSTORE_PASSWORD")
        ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
        ?: keystoreProperties.getProperty("storePassword")
def releaseKeyAlias = project.findProperty("ANDROID_KEYSTORE_ALIAS")
        ?: System.getenv("ANDROID_KEYSTORE_ALIAS")
        ?: keystoreProperties.getProperty("keyAlias")
def releaseKeyPassword = project.findProperty("ANDROID_KEY_PASSWORD")
        ?: System.getenv("ANDROID_KEY_PASSWORD")
        ?: keystoreProperties.getProperty("keyPassword")
def hasReleaseSigning = releaseStorePath != null && !releaseStorePath.toString().trim().isEmpty()
        && releaseStorePassword != null && releaseKeyAlias != null && releaseKeyPassword != null

android {
    namespace 'com.relay.client'
    compileSdk 33

    defaultConfig {
        applicationId "com.relay.pure"
        minSdk 24
        // targetSdk 33: fine for sideload; raising alone does not silence Play Protect.
        // Keep minSdk 24 for older phones / Android TV leanback installs.
        targetSdk 33
        versionCode 49
        versionName "1.0.49"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "client"
    productFlavors {
        relay {
            dimension "client"
            applicationId "com.relay.pure"
            buildConfigField "boolean", "RELAY_LOCK_ORIGIN", "false"
            buildConfigField "String", "RELAY_DEFAULT_ORIGIN", '"https://flashbackrepository.org"'
            resValue "string", "app_name", "Relay"
        }
        flashback {
            dimension "client"
            applicationId "com.flashback.repository"
            buildConfigField "boolean", "RELAY_LOCK_ORIGIN", "true"
            buildConfigField "String", "RELAY_DEFAULT_ORIGIN", '"https://flashbackrepository.org"'
            resValue "string", "app_name", "Flashback Repository"
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                // Absolute path, or relative to this module (android/app/) for CI.
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // Sideload / Fire TV: ship arm64 phones + 32-bit Amazon/Android TV separately.
    // universalApk → downloads/flashback.apk (works everywhere; larger).
    // Per-ABI → flashback-arm64-v8a.apk / flashback-armeabi-v7a.apk (smaller).
    splits {
        abi {
            enable true
            reset()
            // Sideload / Fire TV only. Emulator: -PipfsIncludeX86=true (adds x86_64 split).
            def abis = ["armeabi-v7a", "arm64-v8a"]
            if (project.hasProperty("ipfsIncludeX86")) {
                abis.add("x86_64")
            }
            include(*abis.toArray(new String[0]))
            universalApk true
        }
    }

    packagingOptions {
        pickFirst "**/libc++_shared.so"
        exclude "lib/x86/**"
        if (!project.hasProperty("ipfsIncludeX86")) {
            exclude "lib/x86_64/**"
        }
        // Required so libkubo_daemon.so is a real on-disk executable we can ProcessBuilder.
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    // WIP QuickJs harness — missing test dep; exclude until wired.
    sourceSets {
        test {
            java {
                exclude '**/pure/ActRuntimeTest.kt'
            }
        }
    }
}

// Copy embedded Kubo daemon into jniLibs (gitignored). Build with android/ipfs-kubo/build-kubo-android.sh
tasks.register("syncIpfsKubo", Copy) {
    def prebuilt = file("${rootProject.projectDir}/ipfs-kubo/prebuilt")
    def wantX86 = project.hasProperty("ipfsIncludeX86")
    from("$prebuilt/arm64-v8a") { include "libkubo_daemon.so"; into "arm64-v8a" }
    from("$prebuilt/armeabi-v7a") { include "libkubo_daemon.so"; into "armeabi-v7a" }
    def x64 = new File(prebuilt, "x86_64/libkubo_daemon.so")
    if (wantX86 && x64.isFile()) {
        from("$prebuilt/x86_64") { include "libkubo_daemon.so"; into "x86_64" }
    }
    into "src/main/jniLibs"
    doFirst {
        def a64 = new File(prebuilt, "arm64-v8a/libkubo_daemon.so")
        def v7 = new File(prebuilt, "armeabi-v7a/libkubo_daemon.so")
        if (!a64.isFile() || !v7.isFile()) {
            throw new GradleException(
                "Missing Kubo prebuilts under ${prebuilt}. Run android/ipfs-kubo/build-kubo-android.sh first.",
            )
        }
        // Drop stale emulator lib from jniLibs on production builds.
        if (!wantX86) {
            def stale = file("src/main/jniLibs/x86_64/libkubo_daemon.so")
            if (stale.isFile()) {
                stale.delete()
                logger.lifecycle("syncIpfsKubo: removed jniLibs/x86_64 (release/sideload)")
            }
        }
        logger.lifecycle(
            "syncIpfsKubo: arm64=${a64.length()} v7a=${v7.length()}" +
                (wantX86 && x64.isFile() ? " x86_64=${x64.length()}" : " (no x86_64)"),
        )
    }
}
afterEvaluate {
    tasks.named("preBuild").configure { dependsOn("syncIpfsKubo") }
}

// Sync site markdown into APK assets (offline drawer fallback):
//   ./gradlew :app:syncFlashbackContent -PflashbackContentDir=/path/to/fan-edits/content
tasks.register("syncFlashbackContent", Copy) {
    def contentProp = project.findProperty("flashbackContentDir")
    def contentDir = contentProp != null && !contentProp.toString().trim().isEmpty()
            ? file(contentProp.toString())
            : file("${rootProject.projectDir}/../../../fan-edits/content")
    from(contentDir) {
        include "*.md"
    }
    into "src/main/assets/content"
    doFirst {
        if (!contentDir.isDirectory()) {
            throw new GradleException(
                    "flashback content dir missing: ${contentDir}. Pass -PflashbackContentDir=...",
            )
        }
    }
}

// Write downloads/flashback.json for fan-edits publish tip:
//   ./gradlew :app:writeFlashbackVersionManifest -PflashbackManifestOut=/path/to/fan-edits/downloads/flashback.json
tasks.register("writeFlashbackVersionManifest") {
    doLast {
        def outProp = project.findProperty("flashbackManifestOut")
        if ((outProp == null || outProp.toString().trim().isEmpty()) &&
                project.findProperty("flashbackDownloadsDir") != null) {
            outProp = "${project.findProperty("flashbackDownloadsDir")}/flashback.json"
        }
        if (outProp == null || outProp.toString().trim().isEmpty()) {
            throw new GradleException(
                "Pass -PflashbackManifestOut=/path/to/fan-edits/downloads/flashback.json",
            )
        }
        def outFile = file(outProp.toString())
        outFile.parentFile.mkdirs()
        def code = android.defaultConfig.versionCode
        def name = android.defaultConfig.versionName
        def base = "https://flashbackrepository.org/downloads"
        outFile.text = """{
  "versionCode": ${code},
  "versionName": "${name}",
  "apkUrl": "${base}/flashback.apk",
  "apkUrls": {
    "armeabi-v7a": "${base}/flashback-armeabi-v7a.apk",
    "arm64-v8a": "${base}/flashback-arm64-v8a.apk"
  }
}
"""
        logger.lifecycle("Wrote Flashback version manifest → ${outFile.absolutePath} (versionCode=${code}, versionName=${name})")
    }
}

// Copy split + universal release APKs into fan-edits/downloads after assembleFlashbackRelease:
//   ./gradlew :app:publishFlashbackDownloads \
//     -PflashbackDownloadsDir=/path/to/fan-edits/downloads \
//     -PflashbackManifestOut=/path/to/fan-edits/downloads/flashback.json
tasks.register("publishFlashbackDownloads") {
    // Run :app:syncFlashbackContent first when content changed (not a hard dependsOn —
    // Copy→assets races lint/merge otherwise).
    dependsOn("assembleFlashbackRelease", "writeFlashbackVersionManifest")
    doLast {
        def outProp = project.findProperty("flashbackDownloadsDir")
        if (outProp == null || outProp.toString().trim().isEmpty()) {
            throw new GradleException(
                "Pass -PflashbackDownloadsDir=/path/to/fan-edits/downloads",
            )
        }
        def outDir = file(outProp.toString())
        outDir.mkdirs()
        def releaseDir = file("$buildDir/outputs/apk/flashback/release")
        def mapping = [
            "app-flashback-universal-release.apk"    : "flashback.apk",
            "app-flashback-armeabi-v7a-release.apk"  : "flashback-armeabi-v7a.apk",
            "app-flashback-arm64-v8a-release.apk"    : "flashback-arm64-v8a.apk",
        ]
        mapping.each { srcName, destName ->
            def src = new File(releaseDir, srcName)
            if (!src.isFile()) {
                throw new GradleException("Missing release APK: ${src.absolutePath}")
            }
            def dest = new File(outDir, destName)
            java.nio.file.Files.copy(
                    src.toPath(),
                    dest.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING,
            )
            logger.lifecycle("Published ${destName} (${dest.length()} bytes) ← ${srcName}")
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.21"
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation "androidx.lifecycle:lifecycle-process:2.6.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "com.google.android.material:material:1.9.0"

    // For JSON handling
    implementation "com.google.code.gson:gson:2.10.1"

    // Chat WebSocket → flashback chat-edge (/chat/ws)
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // ExoPlayer (Media3) — hardware decode + MediaSession for headset transport
    implementation "androidx.media3:media3-exoplayer:1.1.1"
    implementation "androidx.media3:media3-ui:1.1.1"
    implementation "androidx.media3:media3-datasource:1.1.1"
    implementation "androidx.media3:media3-database:1.1.1"
    implementation "androidx.media3:media3-session:1.1.1"

    // Markdown for native shells (Setup/Legal/blurbs) — reusable without CleverScript
    implementation "io.noties.markwon:core:4.6.2"
    implementation "io.noties.markwon:linkify:4.6.2"
    implementation "io.noties.markwon:ext-strikethrough:4.6.2"

    // Unit testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlin:kotlin-test:1.8.21"
    // JVM unit tests: Android stub org.json is not mocked — use the real library.
    testImplementation "org.json:json:20231013"

    // Instrumentation testing
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}
