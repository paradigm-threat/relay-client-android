plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.android'
}

// Release signing: prefer android/keystore.properties (gitignored), else -P / env for CI.
// Local keystore lives outside the repo: ~/.android/flashback-release.keystore
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def releaseStorePath = project.findProperty("KEYSTORE_PATH")
        ?: System.getenv("KEYSTORE_PATH")
        ?: keystoreProperties.getProperty("storeFile")
def releaseStorePassword = project.findProperty("ANDROID_KEYSTORE_PASSWORD")
        ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
        ?: keystoreProperties.getProperty("storePassword")
def releaseKeyAlias = project.findProperty("ANDROID_KEYSTORE_ALIAS")
        ?: System.getenv("ANDROID_KEYSTORE_ALIAS")
        ?: keystoreProperties.getProperty("keyAlias")
def releaseKeyPassword = project.findProperty("ANDROID_KEY_PASSWORD")
        ?: System.getenv("ANDROID_KEY_PASSWORD")
        ?: keystoreProperties.getProperty("keyPassword")
def hasReleaseSigning = releaseStorePath != null && !releaseStorePath.toString().trim().isEmpty()
        && releaseStorePassword != null && releaseKeyAlias != null && releaseKeyPassword != null

android {
    namespace 'com.relay.client'
    compileSdk 33

    defaultConfig {
        applicationId "com.relay.pure"
        minSdk 24
        // targetSdk 33: fine for sideload; raising alone does not silence Play Protect.
        // Keep minSdk 24 for older phones / Android TV leanback installs.
        targetSdk 33
        versionCode 14
        versionName "1.0.14"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "client"
    productFlavors {
        relay {
            dimension "client"
            applicationId "com.relay.pure"
            buildConfigField "boolean", "RELAY_LOCK_ORIGIN", "false"
            buildConfigField "String", "RELAY_DEFAULT_ORIGIN", '"https://flashbackrepository.org"'
            resValue "string", "app_name", "Relay"
        }
        flashback {
            dimension "client"
            applicationId "com.flashback.repository"
            buildConfigField "boolean", "RELAY_LOCK_ORIGIN", "true"
            buildConfigField "String", "RELAY_DEFAULT_ORIGIN", '"https://flashbackrepository.org"'
            resValue "string", "app_name", "Flashback Repository"
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                // Absolute path, or relative to this module (android/app/) for CI.
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        pickFirst "**/libc++_shared.so"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

// Write downloads/flashback.json for fan-edits publish tip:
//   ./gradlew :app:writeFlashbackVersionManifest -PflashbackManifestOut=/path/to/fan-edits/downloads/flashback.json
tasks.register("writeFlashbackVersionManifest") {
    doLast {
        def outProp = project.findProperty("flashbackManifestOut")
        if (outProp == null || outProp.toString().trim().isEmpty()) {
            throw new GradleException(
                "Pass -PflashbackManifestOut=/path/to/fan-edits/downloads/flashback.json",
            )
        }
        def outFile = file(outProp.toString())
        outFile.parentFile.mkdirs()
        def code = android.defaultConfig.versionCode
        def name = android.defaultConfig.versionName
        def apkUrl = "https://flashbackrepository.org/downloads/flashback.apk"
        outFile.text = """{\n  "versionCode": ${code},\n  "versionName": "${name}",\n  "apkUrl": "${apkUrl}"\n}\n"""
        logger.lifecycle("Wrote Flashback version manifest → ${outFile.absolutePath} (versionCode=${code}, versionName=${name})")
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.21"
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.9.0"

    // For JSON handling
    implementation "com.google.code.gson:gson:2.10.1"

    // ExoPlayer (Media3) — hardware decode + MediaSession for headset transport
    implementation "androidx.media3:media3-exoplayer:1.1.1"
    implementation "androidx.media3:media3-ui:1.1.1"
    implementation "androidx.media3:media3-datasource:1.1.1"
    implementation "androidx.media3:media3-database:1.1.1"
    implementation "androidx.media3:media3-session:1.1.1"

    // Markdown for native shells (Setup/Legal/blurbs) — reusable without CleverScript
    implementation "io.noties.markwon:core:4.6.2"
    implementation "io.noties.markwon:linkify:4.6.2"
    implementation "io.noties.markwon:ext-strikethrough:4.6.2"

    // Unit testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlin:kotlin-test:1.8.21"

    // Instrumentation testing
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}
