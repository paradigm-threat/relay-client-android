plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.relay.client'
    compileSdk 33

    defaultConfig {
        applicationId "com.relay.client"
        minSdk 24
        targetSdk 33
        versionCode 13
        versionName "1.0.13"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        // Ensure the C++ runtime is packaged once across all native deps
        pickFirst "**/libc++_shared.so"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.21"
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.9.0"

    // Relay Core Libraries
    implementation 'com.clevertree:jscbridge:1.0.0'
    implementation 'com.clevertree:themed-styler-android:1.2.9'
    implementation 'com.clevertree:hook-transpiler-android:1.3.28'
    implementation 'com.clevertree:md2jsx-android:1.0.2'

    // For JSON handling
    implementation "com.google.code.gson:gson:2.10.1"

    // For YAML handling
    implementation "org.yaml:snakeyaml:2.0"

    // Unit testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlin:kotlin-test:1.8.21"

    // Instrumentation testing
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}
